version: 2.1

jobs:


  build-and-push:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Verify Docker
          command: docker version
      - run:
          name: Authenticate to container registry
          command: |
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
              --username "$REGISTRY_USERNAME" \
              --password-stdin
      - run:
          name: Build and push immutable image
          command: |
            IMAGE="$REGISTRY_HOST/$IMAGE_NAME:$CIRCLE_SHA1"
            docker build --pull --platform linux/amd64 -t "$IMAGE" .
            docker push "$IMAGE"



workflows:
  ci-cd:
    jobs:
      - build-and-push:
          filters:
            branches:
              only: main

